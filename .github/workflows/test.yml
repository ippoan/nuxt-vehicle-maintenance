name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: read
  pull-requests: write
  id-token: write
  # ci-workflows#170 で auto-merge.yml の job が checks: read を宣言した
  # (全 check green 検証ガード)。nested (frontend-ci 経由) でも leaf caller の
  # 許可が無いと startup_failure になる (Refs ippoan/ci-workflows#169)。
  checks: read

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      # integration test: docker-compose.test.yml で rust-alc-api (alc-maintenance
      # crate) を立て、tests/integration/ を実 API に対して回す。backend は
      # マージ済みで migrations/147 が 4 テーブルを作るため、
      # tests/fixtures/{init_local_db,seed}.sql を実 schema に合わせて書いて有効化した。
      has_integration: true
      # docker-compose.test.yml が ${API_IMAGE:-…:dev} で backend image を読むので、
      # Release Wave compatibility edge を rust-alc-api に対して記録する。
      # has_integration: true でこれが未設定だと integration-test job は loud fail
      # する (グラフから silent に漏れるのを防ぐ設計)。image_env は「記録した SHA と
      # 同じ image で test した」ことを担保するため必須。
      compat_backend_repo: ippoan/rust-alc-api
      compat_backend_image_env: API_IMAGE
      integration_compose_file: docker-compose.test.yml
      # unit テスト (mock) と混ぜず live だけを回す。tests/integration/ 以外は
      # API_BASE_URL が立っていても mock のままなので、ここで対象を絞る。
      integration_test_command: 'npx vitest run tests/integration'
      # API_BASE_URL が tests/helpers/api-test-env.ts の isLive を立てる。
      # TEST_LIVE=1 は「live のつもりなのに API_BASE_URL が無い」を
      # tests/integration/maintenance.live.test.ts が読み込み時に落とすための目印
      # (env 欠落で丸ごと skip され、検証ゼロのまま緑になるのを防ぐ)。
      integration_env: 'TEST_LIVE=1 API_BASE_URL=http://localhost:18080'
      # deploy: auth-worker 側の前提は実測で確認済み (2026-09-18) —
      # KV origins:prod に https://maintenance.ippoan.org、origins:staging に
      # maintenance-staging / maintenance-preview が実在。INTERNAL_SHARED_SECRET は
      # 全 consumer 共有の Secrets Store entry で wrangler.toml の
      # default / staging / preview すべてに bind 済み (新規払い出し不要)。
      # ACL は ippoan origin を素通しする opt-in 方式 (APP_TENANT_ACL に明示
      # エントリのある origin だけ制限) なので、この repo の登録も要らない。
      has_deploy: true
      install_command: 'npm install'
      post_install_script: 'npx nuxt prepare && npx wrangler types'
      # PR 時に @ippoan/auth-client@dev を overlay install する。
      # createAuthWorkerProxyHandler は dev dist-tag にしか無く、committed
      # lockfile があると "dev" 指定でも npm が古い版を再利用するため
      # (npm/cli#7562)、この overlay が無いと typecheck が
      # "@ippoan/auth-client/server が無い" で必ず fail する。Refs rust-alc-api#434
      use_auth_client_dev: true
    secrets: inherit
